<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仲夏夜扭蛋机 · 开蛋小样</title>
<style>
  :root{
    --ink:#5b3b62; --ink-soft:#8a6a92; --pink:#ec85c3; --gold:#d9ae62;
    --glass:rgba(255,248,252,.72); --glass-line:rgba(255,255,255,.9);
    --shadow:0 18px 60px rgba(160,90,150,.28);
  }
  body.night{ --ink:#f4ecff; --ink-soft:#c9bbf0; --glass:rgba(48,40,104,.72); --glass-line:rgba(190,170,255,.45); --shadow:0 18px 60px rgba(10,6,40,.55); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#f6d3e3;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);transition:background .8s}
  body.night{background:#4a3da8}
  canvas{display:block;touch-action:none}
  button{font:inherit;cursor:pointer}

  /* top bar */
  #top{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
  #brand{pointer-events:auto;padding:10px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
  #brand b{font-size:15px;letter-spacing:.06em}
  #brand small{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}
  #tools{display:flex;gap:8px;pointer-events:auto}
  .pill{border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:13px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
  .pill:hover{transform:translateY(-1px)}

  /* hint near crank */
  #hint{position:fixed;left:0;top:0;z-index:4;pointer-events:none;padding:8px 14px;border-radius:999px;font-size:13px;white-space:nowrap;
    background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);
    transform:translate(-50%,-140%);transition:opacity .3s}
  #hint::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:inherit;border-right:1px solid var(--glass-line);border-bottom:1px solid var(--glass-line);transform:translateX(-50%) rotate(45deg)}

  /* collection */
  #dex{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:22px;
    background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
  #dex .label{font-size:12px;color:var(--ink-soft);margin-right:4px;writing-mode:horizontal-tb}
  .slot{width:46px;height:46px;border-radius:50%;border:1.5px dashed rgba(200,140,190,.6);display:grid;place-items:center;position:relative;background:rgba(255,255,255,.25);color:var(--ink-soft);font-size:14px;transition:transform .2s}
  body.night .slot{border-color:rgba(190,170,255,.5);background:rgba(255,255,255,.06)}
  .slot.filled{border-style:solid;cursor:pointer}
  .slot.filled:hover{transform:translateY(-3px) scale(1.06)}
  .mini{width:34px;height:34px;border-radius:50%;position:relative;overflow:hidden;box-shadow:inset 0 -4px 8px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.12)}
  .mini::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(230,220,255,.55))}
  .mini::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1.5px);height:3px;background:rgba(255,255,255,.95)}
  .slot .tip{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;padding:4px 8px;border-radius:8px;background:var(--glass);opacity:0;pointer-events:none;transition:opacity .2s}
  .slot:hover .tip{opacity:1}
  #count{font-size:12px;color:var(--ink-soft);margin-left:4px;min-width:30px}

  /* overlay */
  #backdrop{position:fixed;inset:0;z-index:8;background:radial-gradient(ellipse at center,rgba(255,240,248,.15),rgba(120,70,130,.32));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none}
  body.night #backdrop{background:radial-gradient(ellipse at center,rgba(60,40,140,.15),rgba(10,6,40,.55))}
  #card{position:fixed;left:50%;top:50%;z-index:9;width:min(440px,92vw);border-radius:26px;overflow:hidden;opacity:0;pointer-events:none;
    background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
    box-shadow:var(--shadow),inset 0 0 0 4px rgba(255,255,255,.18);transform:translate(-50%,-50%)}
  #card::before{content:"";position:absolute;inset:6px;border-radius:21px;border:1px solid rgba(217,174,98,.55);pointer-events:none;z-index:3}
  .cover{position:relative}
  .art{aspect-ratio:16/10;position:relative;overflow:hidden;display:grid;place-items:center}
  .art .ph{position:absolute;right:12px;bottom:10px;font-size:11px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.65);color:#7a5a82}
  .art svg{width:46%;height:auto;filter:drop-shadow(0 10px 18px rgba(120,60,120,.25))}
  .meta{padding:18px 22px 20px}
  .no{font-size:11px;letter-spacing:.2em;color:var(--ink-soft)}
  .meta h2{margin:6px 0 4px;font-size:22px;letter-spacing:.02em}
  .role{margin:0 0 10px;font-size:13px;color:var(--pink);font-weight:600}
  body.night .role{color:#ff9ddf}
  .sum{margin:0;font-size:14px;line-height:1.7;color:var(--ink)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tags span{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(236,133,195,.14);color:var(--ink)}
  .actions{display:flex;gap:10px;margin-top:16px}
  .btn{border:0;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#f39bd0,#b79ae3);box-shadow:0 6px 18px rgba(200,110,180,.35)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(200,140,190,.55);box-shadow:none}
  .btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .reveal{opacity:0;transform:translateY(8px)}

  .detail{position:absolute;inset:0;display:none;flex-direction:column;opacity:0}
  .dhead{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid rgba(200,150,190,.25)}
  .dhead h3{margin:0;font-size:17px;flex:1}
  .dbody{flex:1;min-height:0;position:relative;overflow:hidden}
  .x{width:34px;height:34px;border-radius:50%;border:1px solid rgba(200,140,190,.45);background:transparent;color:var(--ink);font-size:16px}

  /* 海外站 browser */
  .browser{position:absolute;inset:18px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(150,80,140,.18);display:flex;flex-direction:column}
  .bbar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:linear-gradient(#ffe9f3,#fbdbe9)}
  .dot{width:10px;height:10px;border-radius:50%}
  .url{flex:1;margin-left:10px;font-size:12px;color:#9a6f93;background:#fff;border-radius:8px;padding:5px 10px}
  .url .lock{font-size:10px;opacity:.7}
  .live{margin-left:8px;font-size:12px;font-weight:600;color:#fff;text-decoration:none;padding:5px 12px;border-radius:999px;background:linear-gradient(135deg,#f39bd0,#b79ae3);white-space:nowrap}
  .live:hover{filter:brightness(1.06)}
  .shotwrap{padding:0;position:relative;background:#fff}
  .shot{display:block;width:100%;height:auto}
  .shotnote{position:sticky;bottom:0;padding:6px 12px;font-size:11px;color:#9a6f93;background:rgba(255,245,250,.9);text-align:right}
  .scrollhint{position:absolute;right:16px;bottom:40px;font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(91,59,98,.75);color:#fff;pointer-events:none;transition:opacity .3s}
  .cardlink{display:inline-block;margin-top:10px;font-size:12px;color:var(--pink);text-decoration:none;font-weight:600}
  .cardlink:hover{text-decoration:underline}
  .tabs{display:flex;gap:4px;padding:6px 10px 0;background:#fbdbe9;overflow-x:auto}
  .tabs button{border:0;border-radius:10px 10px 0 0;padding:7px 12px;font-size:12px;background:rgba(255,255,255,.5);color:#8b5f85;white-space:nowrap}
  .tabs button.on{background:#fff;color:#c2549d;font-weight:600}
  .page{flex:1;overflow:auto;padding:22px;background:#fff;color:#6b4a6f}
  .sk{border-radius:12px;background:linear-gradient(110deg,#fbe6f0 30%,#fff3f8 50%,#fbe6f0 70%);background-size:200% 100%;animation:sh 1.6s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}

  /* 资管 exploded */
  .ex{position:absolute;inset:0;display:grid;grid-template-columns:1fr 240px}
  .stage{position:relative;perspective:1400px;display:grid;place-items:end center;padding-bottom:70px}
  .stage .note,.reader .note{top:auto;bottom:14px;left:16px;right:auto;text-align:left;max-width:220px}
  .stack{position:relative;width:300px;height:200px;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-38deg)}
  .layer{position:absolute;inset:0;border-radius:18px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.9,.3,1.2),box-shadow .3s;
    border:1.5px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(217,174,98,.4),0 14px 30px rgba(120,70,160,.18);display:grid;place-items:center;font-size:13px;font-weight:600;color:#5b3b62}
  .layer .grid{position:absolute;inset:14px;border-radius:10px;background-image:linear-gradient(rgba(255,255,255,.65) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.65) 1px,transparent 1px);background-size:22px 22px;opacity:.7}
  .layer.hot{box-shadow:0 0 0 2px #fff,0 0 30px rgba(255,157,223,.8)}
  .side{padding:22px 20px 22px 0;display:flex;flex-direction:column;gap:8px;overflow:auto}
  .side .it{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.45);font-size:13px;cursor:pointer;border:1px solid transparent}
  body.night .side .it{background:rgba(255,255,255,.08)}
  .side .it b{display:block;font-size:13px}
  .side .it span{font-size:12px;color:var(--ink-soft)}
  .side .it.hot{border-color:#f39bd0}
  .slider{margin-top:auto;font-size:12px;color:var(--ink-soft)}
  .slider input{width:100%;accent-color:#ec85c3}

  /* 调研 PDF */
  .pdf{position:absolute;inset:0;display:grid;grid-template-columns:120px 1fr}
  .thumbs{overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:10px;border-right:1px solid rgba(200,150,190,.2)}
  .thumbs .t{aspect-ratio:1/1.414;border-radius:6px;background:#fff;box-shadow:0 3px 10px rgba(120,70,140,.15);font-size:10px;padding:6px;color:#9a7aa0;cursor:pointer;border:2px solid transparent}
  .thumbs .t.on{border-color:#8cd7ea}
  .reader{position:relative;display:grid;place-items:center;overflow:hidden}
  .sheet{position:absolute;width:min(380px,60%);aspect-ratio:1/1.414;background:#fff;border-radius:8px;box-shadow:0 18px 40px rgba(70,60,140,.25);padding:26px 26px;color:#4d3d64;font-size:12px;line-height:1.9;transform-origin:50% 120%}
  .sheet h4{margin:0 0 4px;font-size:15px}
  .sheet .sub{color:#8b7aa6;font-size:11px;margin-bottom:12px}
  .ln{height:7px;border-radius:4px;background:#ece6f6;margin:9px 0}
  .blur{display:inline-block;filter:blur(4px);background:#cfc3e8;color:transparent;border-radius:3px;user-select:none}
  .cite{display:inline-block;font-size:9px;padding:0 5px;border-radius:5px;background:#dff4fa;color:#3d8aa3;margin-left:3px}
  .pnav{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;font-size:12px}
  .note{position:absolute;top:10px;right:14px;font-size:11px;color:var(--ink-soft);max-width:260px;text-align:right}

  /* ---------- 总览层（手绘主图） ---------- */
  #ov{position:fixed;inset:0;width:100%;height:100%;z-index:2;opacity:0;transition:opacity .9s ease;cursor:grab}
  #ov.ready{opacity:1}
  #ov.hot{cursor:pointer}
  #ov.dragging{cursor:grabbing}
  #ovTip{position:fixed;left:0;top:0;z-index:4;pointer-events:none;padding:7px 13px;border-radius:999px;font-size:13px;white-space:nowrap;color:var(--ink);
    background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);
    transform:translate(-50%,-120%);opacity:0;transition:opacity .35s}
  #ovTip::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:inherit;border-right:1px solid var(--glass-line);border-bottom:1px solid var(--glass-line);transform:translateX(-50%) rotate(45deg)}
  #ovTip.on{opacity:1}
  #btnSpin,#btnReset,#btnHome,#dex,#hint{transition:opacity .5s, visibility .5s}
  body.ov #dex, body.ov #hint{opacity:0 !important;visibility:hidden;pointer-events:none}
  body.ov #btnSpin, body.ov #btnReset, body.ov #btnHome{display:none}
  #fps{position:fixed;left:8px;bottom:8px;z-index:30;font:11px/1.4 ui-monospace,monospace;color:#fff;background:rgba(60,30,70,.7);padding:4px 8px;border-radius:6px;pointer-events:none;white-space:pre}

  #toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);z-index:20;padding:10px 16px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none}

  @media (max-width:720px){
    #brand small{display:none}
    .ex{grid-template-columns:1fr}.side{display:none}
    .pdf{grid-template-columns:1fr}.thumbs{display:none}
    .stack{width:220px;height:150px}
    #card.expanded{border-radius:20px}
    /* 竖屏：按钮和图鉴不换行 */
    #brand,.pill,#dex .label{white-space:nowrap}
    #brand{padding:8px 12px} #tools{gap:6px} .pill{padding:8px 11px}
    #dex{gap:8px;padding:8px 12px} .slot{width:40px;height:40px}
  }
  @media (max-width:600px){ #btnReset{display:none} .pill .t{display:none} .pill{padding:8px 12px} }

  /* v7：一张画布 */
  #ov{cursor:default}
  #ov.ready{opacity:1}
  #ov.hot{cursor:pointer}
  #ov.dragging{cursor:grabbing}
  .pill.on{background:linear-gradient(135deg,rgba(243,155,208,.85),rgba(183,154,227,.85));color:#fff}
  #say{position:fixed;left:0;top:0;z-index:4;pointer-events:none;padding:5px 11px;border-radius:14px;font-size:12px;white-space:nowrap;color:var(--ink);opacity:0;
    background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);transform:translate(-50%,-100%)}
  img.mini{width:40px;height:40px;object-fit:contain;box-shadow:none;border-radius:0;overflow:visible;filter:drop-shadow(0 3px 5px rgba(150,90,160,.25))}
  .flycap{position:fixed;z-index:12;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(150,90,160,.3))}
</style>
<script>
// 直接双击 / 在文件预览里打开时（file:// 或 data:），浏览器不允许 WebGL 读本地图片，画面会只剩代码画的玻璃砖。

  document.body.appendChild(d);
});
</script>

<body class="ov">
<canvas id="ov"></canvas>
<div id="ovTip">点一下，进入扭蛋机</div>
<div id="say"></div>
<div id="top">
  <div id="brand"><b>仲夏夜扭蛋机</b><small>每颗扭蛋里装着一个项目 · 开蛋特效小样</small></div>
  <div id="tools">
    <button class="pill" id="btnHome" title="返回乐园" aria-label="返回乐园">←<span class="t"> 返回乐园</span></button>
    <button class="pill" id="btnSpin">↻<span class="t"> 扭一下</span></button>
    <button class="pill" id="btnNight">☾<span class="t"> 夜晚</span></button>
    <button class="pill" id="btnSound" aria-pressed="false" title="音效（默认关闭）">♪<span class="t"> 声音</span></button>
    <button class="pill" id="btnReset">重置</button>
  </div>
</div>
<div id="hint">拖动星星手柄转一圈 ↻</div>
<div id="dex"><span class="label">扭蛋图鉴</span><div id="slots"></div><span id="count">0/3</span></div>
<div id="backdrop"></div>
<div id="card">
  <div class="cover">
    <div class="art"></div>
    <div class="meta">
      <div class="no reveal"></div>
      <h2 class="reveal"></h2>
      <p class="role reveal"></p>
      <p class="sum reveal"></p>
      <div class="tags reveal"></div>
      <div class="actions reveal"><button class="btn" id="btnExpand">展开看看</button><button class="btn ghost" id="btnStash">收进图鉴</button></div>
    </div>
  </div>
  <div class="detail"><div class="dhead"><h3></h3><button class="x" id="btnBack" title="收起">↙</button></div><div class="dbody"></div></div>
</div>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';

/* ==================================================================
   仲夏夜扭蛋机 v7 · 画为主，代码为辅
   一张画布、三层场景（屏幕像素坐标，y 向下）：
     clScene  近景：手绘底图 + 景深视差 / 花草摆动 / 云影 / 移轴 / 玻璃砖 / 扭蛋 / 摇柄 / 灯珠 / 泡泡 / 前景
     ovScene  总览：手绘主图 1:1（推镜头时盖在近景上，溶解后露出近景）
     fxScene  粒子：星光、花瓣、拖尾、泡泡水珠
   所有贴图不做色彩空间转换（NoColorSpace），着色器直接输出 sRGB 数值 → 特效全关时和原图逐像素一致。
   ================================================================== */
const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('debug');
const TOUCH = matchMedia('(hover: none)').matches;
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let REDUCED = RM.matches;
const $ = s => document.querySelector(s);
const lerp = THREE.MathUtils.lerp, clamp = THREE.MathUtils.clamp;
const sstep = (a, b, x) => { const t = clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };
const rnd = (a, b) => a + Math.random()*(b - a);
const pick1 = arr => arr[Math.floor(Math.random()*arr.length)];

/* ------------------------------------------------------------------ 项目数据 */
const PROJECTS = [
  { id:'site', color:'#f49ac8', cap:'peach', no:'CAPSULE 01', title:'海外站 · doshglobal.com', role:'图片选用 · 版面层级 · 落地',
    sum:'集团卫浴与建筑陶瓷的海外官网，展示 Monarch 卫浴与 Oceano 瓷砖。首页与六个内页的图片和版面，由我出方案并落地。',
    tags:['官网改版','视觉选图','版面层级','后台手册'], icon:'tile', url:'https://www.doshglobal.com' },
  { id:'asset', color:'#b79ae3', cap:'purple', no:'CAPSULE 02', title:'算力资产台账', role:'资产列表工作台 · 12 个岗位视图 · 统一口径',
    sum:'把设备状态、位置、责任和经营状态放进同一台账：盘面负责发现问题，列表负责定位到哪一台机器。',
    tags:['B 端工作台','角色视图','盘面配置','部件管理'], icon:'server' },
  { id:'research', color:'#8cd7ea', cap:'blue', no:'CAPSULE 03', title:'算力控股调研系统', role:'资料解析 · 报告 Agent · 引用回查',

    p.x += p.vx*dt; p.y += p.vy*dt; p.rot = (p.rot || 0) + (p.spin || 0)*dt;
    const fadeIn = p.fadeIn ? Math.min(1, p.age/p.fadeIn) : 1;
    p.a = p.a0 * fadeIn * (p.hold ? (k < p.hold ? 1 : 1 - (k - p.hold)/(1 - p.hold)) : 1 - k);
    p.sz = p.sz0 * (p.grow ? 1 + k*p.grow : 1 - k*0.3) * (p.tw ? 0.85 + 0.15*Math.sin(p.age*18) : 1);

/* ================================================================== 泡泡：实例化薄膜泡泡（总览、近景各一组）
   彩虹干涉色按「膜厚」算（上薄下厚 + 缓慢流动的噪声），只在边缘明显，中间几乎透明；普通混合，不发光 */
const BUB_VS = `
  attribute vec4 aB;   // x, y（图片像素）, 半径（图片像素）, 种子
  attribute vec4 aC;   // 透明度, 破裂进度, 视差系数, 柔焦
  uniform vec3 uView; uniform vec2 uPar;
  varying vec2 vP; varying float vA, vSeed, vPop, vSoft;
  void main(){
    float R = aB.z * (1.0 + aC.y * 0.25);
    vec2 p = (aB.xy + uPar * aC.z + position.xy * 2.0 * R) * uView.x + uView.yz;
    vP = position.xy * 2.0; vA = aC.x; vSeed = aB.w; vPop = aC.y; vSoft = aC.w;
    gl_Position = projectionMatrix * viewMatrix * vec4(p, 0.0, 1.0);
  }`;
const BUB_FS = `
  uniform float uTime, uNight; varying vec2 vP; varying float vA, vSeed, vPop, vSoft;
  ${GLSL_COMMON}
  void main(){
    float r = length(vP); if (r > 1.0 || vA < 0.003) discard;
    float edge = 1.0 - smoothstep(1.0 - 0.04 - vSoft, 1.0, r);
    float rim = pow(r, 4.0) * edge;
    float th = 0.35 + 0.3 * vnoise(vP * 2.0 + vec2(uTime * 0.15, vSeed * 7.0)) + 0.4 * vP.y;   // 膜厚：下面厚
    vec3 iri = 0.5 + 0.5 * cos(6.2832 * (th * vec3(1.0, 1.15, 1.3) + vSeed));
    vec3 col = mix(vec3(1.0), iri, 0.42);
    float hl = smoothstep(0.32, 0.0, length((vP - vec2(-0.36, -0.42)) * vec2(1.0, 1.7))) * edge;       // 左上一道柔和的弯月高光
    float hl2 = smoothstep(0.13, 0.0, length(vP - vec2(0.42, 0.48))) * 0.4 * edge;
    float a = (0.03 * edge + rim * 0.42 + hl * 0.6 + hl2) * vA * (1.0 - vPop) * (1.0 - uNight * 0.25);
    col = mix(col, vec3(1.0), clamp(hl + hl2, 0.0, 1.0));
    gl_FragColor = vec4(col * a, a);
  }`;
class Bubbles {
  constructor(cap, view, scene, order, size){
    this.cap = cap; this.view = view; this.size = size; this.list = [];
    const g = this.g = new THREE.InstancedBufferGeometry(); g.index = unitPlane.index; g.attributes.position = unitPlane.attributes.position;
    this.b = new Float32Array(cap*4); this.c = new Float32Array(cap*4);
    g.setAttribute('aB', new THREE.InstancedBufferAttribute(this.b, 4)); g.setAttribute('aC', new THREE.InstancedBufferAttribute(this.c, 4));
    this.u = { uView:view, uPar:{ value:new THREE.Vector2() }, uTime:ovU.uTime, uNight:{ value:0 } };
    this.mesh = new THREE.Mesh(g, new THREE.ShaderMaterial({ uniforms:this.u, vertexShader:BUB_VS, fragmentShader:BUB_FS, transparent:true, premultipliedAlpha:true, depthTest:false, depthWrite:false, side:THREE.DoubleSide }));
    this.mesh.frustumCulled = false; this.mesh.renderOrder = order; scene.add(this.mesh);
  }
  spawn(o){
    if (this.list.length >= this.cap) return null;
    const [IW, IH] = this.size;
    const b = Object.assign({ x:rnd(60, IW - 60), y:rnd(IH*0.5, IH), r:rnd(12, 26), vx:0, vy:-rnd(8, 16), seed:Math.random()*10, age:0, life:rnd(22, 34), pop:0, par:1, soft:0, fade:2.5 }, o);
    this.list.push(b); return b;
  }
  pop(b, toScreen, burst = true){
    if (b.pop) return; b.pop = 0.001;
    if (!burst) return;
    const [sx, sy] = toScreen(b.x, b.y), R = b.r*this.view.value.x;
    // 水珠 + 星光
    for (let k = 0; k < (REDUCED ? 4 : 9); k++){
      const a = Math.random()*Math.PI*2, sp = rnd(70, 170);
      FX.add({ x:sx + Math.cos(a)*R*0.8, y:sy + Math.sin(a)*R*0.8, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, g:120, drag:3, life:rnd(0.25, 0.5), sz0:rnd(4, 8), kind:1, color:pick1(['#ffffff', '#e6f6ff', '#ffe6f6']), a0:0.9 });
    }
    sparkle(sx, sy, { n:5, v0:40, v1:120, s0:7, s1:13, l0:0.4, l1:0.8 });
    SFX.play('bubble_pop', { gain:0.5, rate:rnd(0.9, 1.15) });
    return true;
  }
  at(ix, iy){ return this.list.find(b => !b.pop && Math.hypot(ix - (b.x + this.u.uPar.value.x*b.par), iy - (b.y + this.u.uPar.value.y*b.par)) < b.r*1.25); }
  update(dt, t, push){   // push = { x, y, r }：光标附近的泡泡被轻轻推开（图片像素）
    for (let i = this.list.length - 1; i >= 0; i--){
      const b = this.list[i];
      if (b.pop){ b.pop += dt/0.14; if (b.pop >= 1){ this.list.splice(i, 1); b.onGone?.(); } continue; }
      b.age += dt;
      if (push){ const dx = b.x - push.x, dy = b.y - push.y, d = Math.hypot(dx, dy), R = push.r + b.r;
        if (d < R && d > 0.01){ const f = (1 - d/R)*260*dt; b.vx += dx/d*f; b.vy += dy/d*f; } }
      b.vx *= Math.exp(-dt*1.2); b.x += (b.vx + Math.sin(t*0.5 + b.seed)*5)*dt*(REDUCED ? 0.3 : 1); b.y += b.vy*dt*(REDUCED ? 0.3 : 1);
      if (b.age > b.life || b.y < -60) this.pop(b, null, false);
    }
    const n = this.list.length;
    this.list.forEach((b, i) => {
      const life = Math.max(0, Math.min(1, b.age/b.fade, (b.life - b.age)/2.5));
      this.b[i*4] = b.x; this.b[i*4 + 1] = b.y; this.b[i*4 + 2] = b.r*(1 + Math.sin(t*1.7 + b.seed)*0.02); this.b[i*4 + 3] = b.seed;
      this.c[i*4] = life; this.c[i*4 + 1] = Math.min(1, b.pop); this.c[i*4 + 2] = b.par; this.c[i*4 + 3] = b.soft;
    });
    this.g.instanceCount = n;
    this.g.attributes.aB.needsUpdate = true; this.g.attributes.aC.needsUpdate = true;
  }
}

const SFX = {
  on:false, ctx:null, master:null, buf:{}, loopSrc:null, loopGain:null, voices:0, loading:null,
  names:['musicbox_loop', 'crank_click', 'capsule_drop', 'capsule_open', 'capsule_open_rare', 'bubble_pop', 'whoosh', ...[0,1,2,3,4,5,6,7].map(k => 'tile_' + k)],
  ensure(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC({ latencyHint:'interactive' });
    const comp = this.ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    this.master = this.ctx.createGain(); this.master.gain.value = 0.8; this.master.connect(comp); comp.connect(this.ctx.destination);
    this.loading = Promise.all(this.names.map(n => fetch(`assets/sfx/${n}.m4a`).then(r => r.arrayBuffer())
      .then(ab => new Promise((ok, no) => this.ctx.decodeAudioData(ab, ok, no))).then(b => { this.buf[n] = b; }).catch(() => {})));
  },
  toggle(){
    this.ensure(); if (!this.ctx) return;
    this.on = !this.on;
    if (this.on){ this.ctx.resume(); this.loading.then(() => { if (this.on) this.startLoop(); }); }
    else this.stopLoop();
    const b = $('#btnSound'); b.classList.toggle('on', this.on); b.setAttribute('aria-pressed', this.on); b.innerHTML = this.on ? '♪<span class="t"> 声音开</span>' : '♪<span class="t"> 声音</span>';
  },
  startLoop(){
    if (this.loopSrc || !this.buf.musicbox_loop) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.buf.musicbox_loop; s.loop = true;
    const g = this.ctx.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(0.28, this.ctx.currentTime + 1.5);
    s.connect(g); g.connect(this.master); s.start(); this.loopSrc = s; this.loopGain = g;
  },
  stopLoop(){ if (!this.loopSrc) return; const s = this.loopSrc, g = this.loopGain; g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.4); setTimeout(() => s.stop(), 500); this.loopSrc = null; },
  play(name, { gain = 1, rate = 1 } = {}){
    if (!this.on || !this.buf[name] || this.voices > 10) return;
    if (this.ctx.state !== 'running') this.ctx.resume();
    const s = this.ctx.createBufferSource(); s.buffer = this.buf[name]; s.playbackRate.value = rate;
    const g = this.ctx.createGain(); g.gain.value = gain; s.connect(g); g.connect(this.master);
    this.voices++; s.onended = () => this.voices--; s.start();
  },
};

  const rg = g.createRadialGradient(32,32,0,32,32,32); rg.addColorStop(0,'rgba(120,80,170,.55)'); rg.addColorStop(1,'rgba(120,80,170,0)'); g.fillStyle = rg; g.fillRect(0,0,64,64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; t.premultiplyAlpha = true; return t; })();
const beamTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,256,0,0); gr.addColorStop(0,'rgba(255,255,255,.95)'); gr.addColorStop(0.5,'rgba(255,255,255,.35)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,256);
  const hg = g.createLinearGradient(0,0,64,0); hg.addColorStop(0,'rgba(0,0,0,1)'); hg.addColorStop(0.5,'rgba(0,0,0,0)'); hg.addColorStop(1,'rgba(0,0,0,1)');
  g.globalCompositeOperation = 'destination-out'; g.fillStyle = hg; g.fillRect(0,0,64,256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; t.premultiplyAlpha = true; return t; })();
function capName(k, rare){ return rare ? 'gold' : PROJECTS[k].cap; }
function dispense(){
  const k = S.next; S.rare = Q.has('rare') || Math.random() < RARE_P;
  const name = capName(k, S.rare);
  const T = CLOSE.tiles[CLOSE.rest];
  const cap = { k, rare:S.rare, x:CLOSE.exit[0], y:CLOSE.exit[1] + 30, z:30, r:23, rot:0, sc:0.55, a:0, bob:0, lift:0, hover:false };
  cap.shadow = makeSprite(shadowTex, { size:[60, 22], order:2, alpha:0 });
  cap.sp = makeSprite(capTex[name], { size:[cap.r*2.16, cap.r*2.16], order:7 });
  S.cap = cap;
  const path = [ [CLOSE.lip[0], CLOSE.lip[1], 0.32, 0], [CLOSE.step[0], CLOSE.step[1], 0.3, 26], [CLOSE.tiles[0][0], CLOSE.tiles[0][1], 0.3, 22], [T[0], T[1], 0.75, 0] ];
  const tl = gsap.timeline({ onComplete(){ landed(); } });
  tl.to(cap, { sc:1, a:1, duration:.3 }, 0);
  tl.to(cap, { y:CLOSE.lip[1] - 4, z:0, duration:.32, ease:'power1.in' }, 0);
  tl.add(() => { SFX.play('capsule_drop', { gain:0.6 }); confetti(); }, .3);
  let at = .32;
  path.slice(1).forEach(([x, y, dur, h], n) => {
    const o = { t:0 }; let x0, y0;
    tl.add(() => { x0 = cap.x; y0 = cap.y; }, at);
    tl.to(o, { t:1, duration:dur, ease:h ? 'none' : 'power2.out', onUpdate(){ cap.x = lerp(x0, x, o.t); cap.y = lerp(y0, y, o.t); cap.z = Math.sin(Math.PI*o.t)*h; } }, at);
    at += dur;
    if (h) tl.add(() => { SFX.play('capsule_drop', { gain:0.45, rate:1.1 + n*0.08 }); }, at);
  });
  tl.add(() => tileHit(0, { sound:false, strength:0.6 }), .32 + 0.3 + 0.3);
  if (REDUCED) tl.progress(1);
}
function confetti(){
  const [x, y] = clToScreen(...CLOSE.exit);
  sparkle(x, y, { n:24, dir:-Math.PI/2, spread:1.1, v0:160, v1:330, g:420, drag:1.4, s0:7, s1:13, l0:0.8, l1:1.4, colors:['#ffc4ea', '#fff1b8', '#bfe6ff', '#d7c4ff', '#ffffff'] });
}
function landed(){
  S.mode = 'waiting';
  const cap = S.cap;
  tileHit(CLOSE.rest, { strength:1 });
  S.restPulse = gsap.to({}, { duration:1.4, repeat:-1, onRepeat(){ if (S.mode === 'waiting') tileHit(CLOSE.rest, { sound:false, strength:0.55 }); } });
  setHint(cap.rare ? '金色的！点一下开蛋 ✦' : '点一下扭蛋，开蛋！', [cap.x, cap.y - 50]);
}
function updateCap(dt, t){
  const c = S.cap; if (!c) return;
  if (S.mode === 'dispensing'){ c.rot += (Math.hypot(c.x - (c.px ?? c.x), c.y - (c.py ?? c.y)))/c.r*Math.sign(c.x - (c.px ?? c.x) || 1); }
  c.px = c.x; c.py = c.y;
  if (S.mode === 'waiting'){ c.bob = Math.abs(Math.sin(t*3))*5; c.wob = Math.sin(t*3)*0.12; } else { c.bob = 0; c.wob = 0; }
  const z = c.z + c.bob + c.lift, ks = floorScale(c.y);
  c.sp.u.uPos.value.set(c.x + (c.shx || 0), c.y - c.r*ks - z); c.sp.u.uScale.value.set(c.sc*ks, c.sc*ks); c.sp.u.uRot.value = c.rot + c.wob; c.sp.u.uAlpha.value = c.a;
  c.sp.u.uBright.value = c.hover ? 0.08 : 0;
  c.shadow.u.uPos.value.set(c.x + 6, c.y + 2); c.shadow.u.uScale.value.set(ks*(1 - z/160), ks*(1 - z/160)); c.shadow.u.uAlpha.value = c.a*(1 - z/120);
  [c.sp, c.shadow, c.top].forEach(s => { if (s) s.depthD = depthAtY(c.y); });
  if (c.top){
    const p = c.top; if (p.v){ p.v[1] += 900*dt; p.x += p.v[0]*dt; p.y += p.v[1]*dt; p.ang += p.w*dt;
      if (p.y > p.ground){ p.y = p.ground; p.v[1] *= -0.32; p.v[0] *= 0.6; p.w *= 0.5; if (Math.abs(p.v[1]) < 40){ p.v = null; gsap.to(p, { ang:Math.PI, duration:.3 }); } } }
    p.sp.u.uPos.value.set(p.x, p.y); p.sp.u.uRot.value = p.ang; p.sp.u.uScale.value.set(c.sc*ks, c.sc*ks);
  }
}

/* ================================================================== ③ 开蛋 */
function openCapsule(){
  const cap = S.cap; if (!cap || S.mode !== 'waiting') return;
  S.mode = 'opening'; setHint(''); S.restPulse?.kill();
  const k = cap.k, p = PROJECTS[k], rare = cap.rare;
  const tl = gsap.timeline(); S.tl = tl;
  const sh = { a:0 };
  tl.to(cap, { lift:34, duration:.45, ease:'power2.out' }, 0);
  tl.to(sh, { a:1, duration:.42, ease:'power2.in', onUpdate(){ cap.shx = Math.sin(performance.now()/1000*70)*3*sh.a; } }, 0);
  tl.to(cap, { rot:0, duration:.3 }, 0);
  tl.add(() => {
    cap.shx = 0;
    const name = capName(k, rare), ks = floorScale(cap.y);
    // 换成下半壳，上半壳单独飞出去
    cap.sp.u.map.value = capTex[name + '_bottom'];
    const topSp = makeSprite(capTex[name + '_top'], { size:[cap.r*2.16, cap.r*2.16], order:7 });
    const cy = cap.y - cap.r*ks - cap.z - cap.lift;
    cap.top = { sp:topSp, x:cap.x, y:cy, v:[rnd(-90, -40), -rnd(360, 420)], w:rnd(-7, -4), ang:0, ground:cap.y - cap.r*ks*0.6 };
    const [sx, sy] = clToScreen(cap.x, cy);
    SFX.play(rare ? 'capsule_open_rare' : 'capsule_open', { gain:0.75 });
    sparkle(sx, sy, { n:rare ? 70 : 40, v0:90, v1:rare ? 420 : 300, up:120, g:260, s0:8, s1:rare ? 22 : 17, l0:0.7, l1:1.5, colors:rare ? ['#ffe08a', '#fff3c4', '#ffffff', '#ffc96b'] : [p.color, '#ffe6aa', '#ffffff'] });
    for (let b = 0; b < (REDUCED ? 0 : 5); b++) clBub.spawn({ x:cap.x + rnd(-20, 20), y:cy + rnd(-10, 10), r:rnd(6, 13), vy:-rnd(40, 80), vx:rnd(-30, 30), life:rnd(2, 3.5), fade:0.2, par:0.9 });
    beamUp(cap.x, cy + cap.r*ks, rare ? '#ffd56b' : p.color, rare ? 2.0 : 1);
    if (rare && !REDUCED){ gsap.fromTo(canvas, { x:0 }, { keyframes:[{ x:-6 }, { x:5 }, { x:-3 }, { x:2 }, { x:0 }], duration:.4 }); toast('金色稀有蛋 ✦'); }
    // 附近的玻璃砖依次亮一下（由近及远，音阶往上走）
    CLOSE.tiles.map((T, i) => [i, Math.hypot(T[0] - cap.x, T[1] - cap.y)]).sort((a, b) => a[1] - b[1])
      .forEach(([i, d], n) => gsap.delayedCall(0.05 + d*0.0022, () => tileHit(i, { sound:n < 5, strength:0.7 })));
    sproutFacilities(k);
  }, .45);
  tl.to(cap, { lift:0, duration:.45, ease:'bounce.out' }, .5);
  tl.add(() => { const [x, y] = clToScreen(cap.x, cap.y - 60); openCard(k, null, { x, y }, rare); }, .65);
  if (REDUCED) tl.progress(1);
}
function beamUp(x, y, color, k){
  const sp = makeSprite(beamTex, { pos:[x, y], size:[90*k*0.6, 360*k], pivot:[0.5, 1], order:8, alpha:0 });
  sp.u.uTint.value.set(color); sp.depthD = depthAtY(y);
  gsap.timeline({ onComplete(){ removeSprite(sp); } })
    .fromTo(sp.u.uScale.value, { x:0.2 }, { x:1, duration:.35, ease:'power2.out' }, 0)
    .to(sp.u.uAlpha, { value:0.55, duration:.2 }, 0).to(sp.u.uAlpha, { value:0, duration:1.1, ease:'power2.in' }, .45);
}

const PROP = {
  parasol:     { f:'parasol_table', w:782,  h:1000, foot:[395,875], by:'w', size:3.2 },
  hedge:       { f:'flower_hedge',  w:1100, h:336,  foot:[550,262], by:'w', size:4.2 },
  lavender:    { f:'lavender',      w:121,  h:360,  foot:[61,354],  by:'h', size:1.15 },
  wildflowers: { f:'wildflowers',   w:480,  h:119,  foot:[241,90],  by:'w', size:1.9 },
  dais:        { f:'glass_dais',    w:720,  h:462,  foot:[359,290], by:'w', size:2.8 },
  balloons:    { f:'balloons',      w:350,  h:600,  foot:[166,556], by:'h', size:2.4 },
};
const propTexCache = {};
function propTex(f){ return propTexCache[f] || (propTexCache[f] = tex(`assets/props/${f}.png`, undefined, { premul:true })); }
const SPROUTS = [   // 底图像素坐标（脚底）
  [['parasol', 1235, 560, { scale:0.72 }], ['wildflowers', 1150, 590], ['lavender', 1318, 585]],
  [['dais', 1395, 470], ['lavender', 1330, 480, { flip:true }], ['lavender', 1462, 492]],
  [['balloons', 1180, 760], ['wildflowers', 1270, 790, { flip:true }], ['lavender', 1110, 770]],
  [['hedge', 1290, 880, { scale:0.8 }], ['lavender', 1180, 895], ['wildflowers', 1395, 900]],
];
function addProp(key, x, y, o = {}){
  const P = PROP[key], unit = 52*floorScale(y)*(o.scale || 1);              // 1 个世界单位 ≈ 半块地砖
  const s = (P.by === 'w' ? P.size/P.w : P.size/P.h)*unit;
  const sp = makeSprite(propTex(P.f), { pos:[x, y], size:[P.w*s, P.h*s], pivot:[P.foot[0]/P.w, P.foot[1]/P.h], order:2 });
  sp.depthD = depthAtY(y); sp.flip = o.flip ? -1 : 1; sp.u.uNight.value = S.night;
  return sp;
}
const sprouted = [];
function sproutFacilities(k){
  (SPROUTS[k] || []).forEach(([key, x, y, o], n) => {
    const sp = addProp(key, x, y, o); sp.u.uScale.value.set(0.001, 0.001); sprouted.push(sp);
    const delay = 0.5 + n*0.18;
    gsap.to(sp.u.uScale.value, { x:sp.flip, y:1, duration:.7, delay, ease:'back.out(2.2)' });
    gsap.delayedCall(delay, () => { const [sx, sy] = clToScreen(x, y - 20); sparkle(sx, sy, { n:10, up:80, colors:[PROJECTS[k].color, '#ffffff', '#ffe6aa'] }); });
  });
}

function buildAsset(body){

    <label class="slider">拆开程度<input type="range" min="0" max="100" value="70"></label></div></div>`;
  const els = [...body.querySelectorAll('.layer')], items = [...body.querySelectorAll('.it')];
  let gap = 70, hot = -1;
  const place = () => els.forEach((e,i)=>{ e.style.transform = `translateZ(${i*gap + (i===hot ? 26 : 0)}px)`; e.classList.toggle('hot', i===hot); });
  const setHot = i => { hot = i; place(); items.forEach(it=>it.classList.toggle('hot', +it.dataset.i===i)); };
  els.forEach(e=>{ e.onmouseenter=()=>setHot(+e.dataset.i); e.onmouseleave=()=>setHot(-1); });
  items.forEach(it=>{ it.onmouseenter=()=>setHot(+it.dataset.i); it.onmouseleave=()=>setHot(-1); });
  body.querySelector('input').oninput = e => { gap = +e.target.value; place(); };
  // 入场：先叠成一摞，再一层层弹开
  const o = { g:0 }; els.forEach(e=>e.style.transition='none');
  gsap.to(o,{ g:70, duration:1.1, ease:'elastic.out(1,.55)', delay:.15, onUpdate(){ gap = o.g; place(); }, onComplete(){ els.forEach(e=>e.style.transition=''); } });
  gsap.from(els,{ opacity:0, y:-40, stagger:.08, duration:.35 });
}

  };
  // 入场：一叠页面扇形展开 → 收成阅读器
  gsap.set(sheets,{ opacity:0, y:120, scale:.6, rotation:0 });
  const tl = gsap.timeline();

  tl.to(sheets.slice(1),{ opacity:0, rotation:0, x:0, scale:.6, duration:.35, ease:'power2.in' }, '+=.35');

}

/* ================================================================== 卡片（打开 / 收进图鉴） */
function openCard(k, fromRect, fromPt, rare){
  curK = k; curRare = !!rare; fillCard(k);

  gsap.set(card, { width:Math.min(440, innerWidth*0.92), height:'auto' });

  const dx = from.x - innerWidth/2, dy = from.y - innerHeight/2;
  card.style.pointerEvents = 'auto'; backdrop.style.pointerEvents = 'auto';
  const reveals = card.querySelectorAll('.reveal');

  tl.fromTo(art.querySelector('svg'), { scale:0.4, rotation:-20 }, { scale:1, rotation:0, duration:.8, ease:'elastic.out(1,.5)' }, .3);
  tl.to(reveals, { opacity:1, y:0, duration:.35, stagger:.07, ease:'power2.out' }, .4);
  if (REDUCED) tl.progress(1);
}
let curK = -1, curRare = false;
function stashCard(){
  if (S.mode !== 'card') return;
  const k = curK, slot = slotsEl.children[k], fromCapsule = !!S.cap;
  if (!S.opened.includes(k)) S.opened.push(k);
  slot.style.display = '';
  const r = slot.getBoundingClientRect();
  const dx = r.left + r.width/2 - innerWidth/2, dy = r.top + r.height/2 - innerHeight/2;
  S.mode = 'closing';
  const tl = gsap.timeline({ onComplete(){
    card.style.pointerEvents = 'none'; backdrop.style.pointerEvents = 'none'; card.classList.remove('expanded');
    if (fromCapsule) fillSlot(k, curRare);
    afterStash(fromCapsule);
  } });
  tl.to(card, { scale:0.06, duration:.55, ease:'power3.in' }, 0);
  tl.to(card, { x:dx*0.5, y:dy*0.5 - 120, duration:.3, ease:'power1.out' }, 0);
  tl.to(card, { x:dx, y:dy, duration:.3, ease:'power2.in' }, .3);
  tl.to(card, { opacity:0, duration:.12 }, .5);
  tl.to(backdrop, { opacity:0, duration:.4 }, .1);
  if (fromCapsule){
    // 扭蛋飞进图鉴：屏幕上的一颗小扭蛋沿弧线飞到格子里
    const cap = S.cap, [sx, sy] = clToScreen(cap.x, cap.y - cap.r);
    const img = document.createElement('img'); img.src = `assets/capsules/256/capsule_${capName(cap.k, cap.rare)}.webp`; img.className = 'flycap';
    document.body.appendChild(img);
    gsap.set(img, { left:sx, top:sy, xPercent:-50, yPercent:-50, width:cap.r*2*CL.s, opacity:0 });
    gsap.timeline({ delay:.35, onComplete(){ img.remove(); } })
      .to(img, { opacity:1, duration:.15 })
      .to(img, { left:r.left + r.width/2, duration:.7, ease:'power1.inOut' }, 0)
      .to(img, { top:r.top + r.height/2, duration:.7, ease:'back.in(1.6)' }, 0)
      .to(img, { width:34, rotation:360, duration:.7 }, 0);
  }
}
function afterStash(fromCapsule){
  if (fromCapsule && S.cap){
    const cap = S.cap; S.cap = null;
    [cap.sp, cap.shadow, cap.top?.sp].filter(Boolean).forEach(sp => gsap.to(sp.u.uAlpha, { value:0, duration:.35, onComplete(){ removeSprite(sp); } }));
    S.next = Math.min(S.next + 1, 4);

}

/* 近景命中测试（图片像素） */
function clHit(ix, iy){
  const d = (p, x = ix, y = iy) => Math.hypot(x - p[0], y - p[1]);
  if (S.mode === 'waiting' && S.cap && Math.hypot(ix - S.cap.x, iy - (S.cap.y - S.cap.r)) < S.cap.r*1.6) return { kind:'cap', c:[S.cap.x, S.cap.y - S.cap.r], r:S.cap.r*1.7 };
  if (S.mode === 'idle' && d(CLOSE.crank) < 44) return { kind:'crank', c:CLOSE.crank, r:42 };
  const b = clBub.at(ix, iy); if (b) return { kind:'bubble', b };
  if (Math.hypot(ix - 466, iy - 62) < 46) return { kind:'moon', c:[466, 64], r:52 };
  for (let i = 0; i < 2; i++){ const [x0, y0, x1, y1] = CLOSE.girls[i].box; if (ix > x0 - 4 && ix < x1 + 4 && iy > y0 - 6 && iy < y1) return { kind:'girl', i, c:[(x0 + x1)/2, (y0 + y1)/2], r:(y1 - y0)*0.62 }; }
  if (d(CLOSE.carousel.c) < CLOSE.carousel.r) return { kind:'carousel', c:CLOSE.carousel.c, r:CLOSE.carousel.r*1.1 };
  if (d(CLOSE.ferris.c) < CLOSE.ferris.r*1.05) return { kind:'ferris', c:CLOSE.ferris.c, r:CLOSE.ferris.r*1.15 };
  const t = tileAt(ix, iy); if (t >= 0) return { kind:'tile', i:t };
  for (const c of CLOSE.clumps){ if (((ix - c[0])/c[2])**2 + ((iy - c[1])/c[3])**2 < 1) return { kind:'flower', c:[c[0], c[1]], cl:c, r:Math.max(c[2], c[3])*1.1 }; }
  return null;
}
function clActivate(h, e){
  switch (h.kind){
    case 'cap': openCapsule(); break;
    case 'crank': startCrank(e); break;
    case 'bubble': clBub.pop(h.b, clToScreen); break;
    case 'moon': toggleNight(); break;
    case 'girl': girlHop(h.i); break;
    case 'carousel': carouselShow(); break;
    case 'ferris': ferrisSpin(); break;
    case 'tile': tileHit(h.i); S.lastTile = h.i; break;
    case 'flower': flowerBurst(h.cl); break;
  }
}

/* ================================================================== ⑥ 指针：总览（拖动平移 / 点扭蛋机 / 戳泡泡 / 按住吹泡泡）+ 近景 */
const P = { down:null, blow:null, last:null, trailAcc:0, lastTile:-1 };
const ovToImg = (x, y) => [(x - OV.ox)/OV.s, (y - OV.oy)/OV.s];
const ovToScreen = (x, y) => [x*OV.s + OV.ox, y*OV.s + OV.oy];
function ovClampPan(){ const [IW, IH] = OVERVIEW.size; OV.ox = Math.min(0, Math.max(innerWidth - IW*OV.s, OV.ox)); OV.oy = Math.min(0, Math.max(innerHeight - IH*OV.s, OV.oy)); }
function overMachine(x, y){ const [ix, iy] = ovToImg(x, y), M = OVERVIEW.machine; return ((ix - M.c[0])/M.rx)**2 + ((iy - M.c[1])/M.ry)**2 <= 1; }
const layer = () => OV.mode === 'overview' ? { bub:ovBub, toImg:ovToImg, toScreen:ovToScreen } : { bub:clBub, toImg:clToImg, toScreen:clToScreen };

canvas.addEventListener('pointerdown', e => {
  SFX.ctx?.resume(); P.pos = [e.clientX, e.clientY];
  if (S.mode === 'card' || S.mode === 'closing') return;
  const L = layer();
  if (OV.mode === 'overview'){
    gsap.killTweensOf(OV, 'ox,oy');
    const b = L.bub.at(...L.toImg(e.clientX, e.clientY));
    if (b){ L.bub.pop(b, L.toScreen); return; }
  } else if (OV.mode === 'closeup'){
    const h = clHit(...clToImg(e.clientX, e.clientY));
    if (h){ clActivate(h, e); if (h.kind === 'crank' || h.kind === 'tile') canvas.setPointerCapture(e.pointerId); if (h.kind !== 'tile') return; }
  } else return;
  // 空白处：拖动 = 平移画面；按住不动 = 从光标吹出一串泡泡
  P.down = { x:e.clientX, y:e.clientY, ox:OV.mode === 'overview' ? OV.ox : CL.ox, oy:OV.mode === 'overview' ? OV.oy : CL.oy, moved:false, vx:0, vy:0, lx:e.clientX, ly:e.clientY, lt:performance.now(), t0:performance.now(), strum:OV.mode === 'closeup' && tileAt(...clToImg(e.clientX, e.clientY)) >= 0 };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY;
  if (e.pointerType === 'mouse'){ OV.parT.set(x/innerWidth*2 - 1, y/innerHeight*2 - 1); CL.parT.copy(OV.parT); }
  P.pos = [x, y];
  // 光标拖尾：按移动距离撒很淡的星光
  if (P.last && !REDUCED){
    P.trailAcc += Math.hypot(x - P.last[0], y - P.last[1]);
    while (P.trailAcc > 16 && FX.list.filter(p => p.trail).length < 40){ P.trailAcc -= 16;
      FX.add({ x:x + rnd(-3, 3), y:y + rnd(-3, 3), vx:rnd(-12, 12), vy:rnd(5, 25), g:12, drag:1, life:rnd(0.5, 0.9), sz0:rnd(5, 10), kind:Math.random() < 0.6 ? 0 : 1, color:pick1(['#ffffff', '#ffe6aa', '#ffd0ec']), a0:0.32 + S.night*0.35, trail:true, spin:2 }); }
    if (P.trailAcc > 16) P.trailAcc = 0;
  }
  P.last = [x, y];
  if (S.dragging){ onCrankDrag(e); return; }
  if (P.down){
    const d = P.down, dx = x - d.x, dy = y - d.y;
    if (d.strum){ const t = tileAt(...clToImg(x, y)); if (t >= 0 && t !== P.lastTile){ P.lastTile = t; tileHit(t); } return; }
    if (!P.blow && !d.moved && Math.hypot(dx, dy) > 6){ d.moved = true; canvas.classList.add('dragging'); }
    if (d.moved && !P.blow){
      if (OV.mode === 'overview'){ OV.ox = d.ox + dx; OV.oy = d.oy + dy; ovClampPan(); }
      else if (OV.mode === 'closeup'){ CL.ox = d.ox + dx; CL.oy = d.oy + dy; clClamp(); }
      const now = performance.now(), k = Math.max(1, now - d.lt);
      d.vx = (x - d.lx)/k*1000; d.vy = (y - d.ly)/k*1000; d.lx = x; d.ly = y; d.lt = now;
    }
    return;
  }
  hover(x, y);
});
function hover(x, y){
  if (OV.mode === 'overview'){
    const hot = overMachine(x, y), bub = !!ovBub.at(...ovToImg(x, y));
    canvas.classList.toggle('hot', hot || bub);
    if (!TOUCH && hot !== (OV.hover > 0.5)) gsap.to(OV, { hover:hot ? 1 : 0, duration:hot ? .45 : .6, ease:'sine.out', overwrite:'auto' });
    return;
  }
  if (OV.mode !== 'closeup') return;
  const [ix, iy] = clToImg(x, y), h = S.mode === 'card' ? null : clHit(ix, iy);
  canvas.classList.toggle('hot', !!h);
  // 鼠标划过玻璃砖：亮一下 + 一个音符（连续划过去就是一段旋律）
  const t = h && h.kind === 'tile' ? h.i : -1;
  if (t >= 0 && t !== P.lastTile && !TOUCH) tileHit(t);
  P.lastTile = t;
  const target = h && h.c ? h : null;
  if (target !== CL.hot && (target?.kind !== CL.hot?.kind || target?.i !== CL.hot?.i)){
    CL.hot = target; const H = clU.uHot.value;
    if (target){ H.x = target.c[0]; H.y = target.c[1]; H.z = target.r; }
    gsap.to(H, { w:target && target.kind !== 'bubble' ? 1 : 0, duration:.3, overwrite:true });
  }
}
canvas.addEventListener('pointerup', e => {
  if (S.dragging){ S.dragging = false; finishCrank(); return; }
  const d = P.down; P.down = null; canvas.classList.remove('dragging');
  if (P.blow){ P.blow = null; return; }
  if (!d) return;
  if (d.moved){
    if (performance.now() - d.lt < 80){
      if (OV.mode === 'overview') gsap.to(OV, { ox:OV.ox + d.vx*0.22, oy:OV.oy + d.vy*0.22, duration:.7, ease:'power3.out', onUpdate:ovClampPan });
      else gsap.to(CL, { ox:CL.ox + d.vx*0.22, oy:CL.oy + d.vy*0.22, duration:.7, ease:'power3.out', onUpdate:clClamp });
    }
    return;
  }
  if (OV.mode === 'overview' && overMachine(e.clientX, e.clientY)) enterMachine();
});
canvas.addEventListener('pointerleave', () => { if (!TOUCH){ gsap.to(OV, { hover:0, duration:.6, overwrite:'auto' }); gsap.to(clU.uHot.value, { w:0, duration:.3 }); CL.hot = null; } OV.parT.set(0, 0); CL.parT.set(0, 0); P.last = null; });
canvas.addEventListener('pointercancel', () => { P.down = null; P.blow = null; S.dragging && (S.dragging = false, finishCrank()); });
function updateBlow(dt){
  // 按住 0.3 秒不动：开始吹泡泡（同时最多 40 颗）
  const d = P.down;
  if (d && !d.moved && !d.strum && !P.blow && performance.now() - d.t0 > 300 && (OV.mode === 'overview' || OV.mode === 'closeup')) P.blow = { acc:0 };
  if (!P.blow || !P.pos) return;
  P.blow.acc += dt;
  const L = layer();
  while (P.blow.acc > 0.11){ P.blow.acc -= 0.11;
    const [ix, iy] = L.toImg(...P.pos), k = OV.mode === 'overview' ? 0.6 : 1;
    L.bub.spawn({ x:ix + rnd(-4, 4), y:iy + rnd(-4, 4), r:rnd(7, 18)*k, vx:rnd(-50, 50), vy:-rnd(30, 70), life:rnd(5, 9), fade:0.15, age:0, par:0.8 });
  }
}

/* 陀螺仪（手机）：慢慢回中 + 平滑；iOS 第一次点按时请求权限 */
let gyro0 = null;
function onOrient(e){
  if (e.gamma == null) return;
  const ang = (screen.orientation && screen.orientation.angle) || 0;
  let gx = e.gamma, gy = clamp(e.beta, -80, 80);
  if (ang === 90){ [gx, gy] = [gy, -gx]; } else if (ang === 270 || ang === -90){ [gx, gy] = [-gy, gx]; }
  if (!gyro0) gyro0 = { x:gx, y:gy };
  gyro0.x += (gx - gyro0.x)*0.006; gyro0.y += (gy - gyro0.y)*0.006;
  OV.parT.set(clamp((gx - gyro0.x)/15, -1, 1), clamp((gy - gyro0.y)/15, -1, 1)); CL.parT.copy(OV.parT);
}
if (TOUCH){
  OV.hover = 1;
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function')
    canvas.addEventListener('click', () => DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') addEventListener('deviceorientation', onOrient); }).catch(() => {}), { once:true });
  else addEventListener('deviceorientation', onOrient);
}


/* ================================================================== ⑦ 总览布局 + 推镜头 */
function ovCover(){ const [IW, IH] = OVERVIEW.size; return Math.max(innerWidth/IW, innerHeight/IH) * (1 + 2*OVERVIEW.parallax/Math.min(innerWidth, innerHeight)); }
function ovLayout(first){
  const [IW, IH] = OVERVIEW.size, W = innerWidth, H = innerHeight;
  const cx = first ? (W/H < 1 ? OVERVIEW.machine.c[0] : IW/2) : (W/2 - OV.ox)/OV.s;
  const cy = first ? IH/2 : (H/2 - OV.oy)/OV.s;
  OV.s = ovCover(); OV.ox = W/2 - cx*OV.s; OV.oy = H/2 - cy*OV.s; ovClampPan();
}
function pushPlan(){
  clLayout();
  const A = OVERVIEW.anchor, h = OV.home;
  return { A, s0:h.s, P0:{ x:A[0]*h.s + h.ox, y:A[1]*h.s + h.oy }, Pend:{ x:CLOSE.anchor[0]*CL.s + CL.ox, y:CLOSE.anchor[1]*CL.s + CL.oy }, Send:CL.s*CLOSE.ratio, cl:{ s:CL.s, ox:CL.ox, oy:CL.oy } };
}
function setPush(e){
  const T = OV.T; OV.push = e;
  const s = T.s0*Math.pow(T.Send/T.s0, e);
  const Px = lerp(T.P0.x, T.Pend.x, e), Py = lerp(T.P0.y, T.Pend.y, e);
  OV.s = s; OV.ox = Px - T.A[0]*s; OV.oy = Py - T.A[1]*s;
  ovU.uBlur.value = sstep(0.02, 0.5, e); ovU.uBand.value = lerp(260, 90, e);
  ovU.uDissolve.value = sstep(0.4, 0.84, e); ovU.uDisC.value.set(Px, Py);
  // 近景同步：主图 1px = 近景 ratio px，对齐点落在同一个屏幕位置
  const cs = s/CLOSE.ratio; CL.s = cs; CL.ox = Px - CLOSE.anchor[0]*cs; CL.oy = Py - CLOSE.anchor[1]*cs;
  CL.pushDof = 1 - sstep(0.55, 1.0, e);
  LAYER.close = e > 0.3; LAYER.ov = e < 0.995;
  document.body.classList.toggle('ov', e < 0.55);
}
const LAYER = { close:false, ov:true };
function enterMachine(){
  if (OV.mode !== 'overview' || !OV.ready) return;
  if (!CL.ready){ toast('近景还在加载，稍等一下…'); CL.pendingEnter = true; return; }
  OV.mode = 'pushing'; OV.home = { s:OV.s, ox:OV.ox, oy:OV.oy };
  $('#ovTip').classList.remove('on'); canvas.classList.remove('hot');
  gsap.killTweensOf(OV, 'ox,oy'); gsap.to(OV, { hover:0, duration:.4, overwrite:'auto' });
  OV.T = pushPlan();
  const first = !CL.entered; if (first) veilTiles();
  SFX.play('whoosh', { gain:0.5 });
  swish(1);
  const o = { e:0 };
  gsap.to(o, { e:1, duration:REDUCED ? .5 : 1.25, ease:'power2.inOut', onUpdate(){ setPush(o.e); },
    onComplete(){
      OV.mode = 'closeup'; Object.assign(CL, OV.T.cl); CL.pushDof = 0; LAYER.ov = false;
      if (first){ CL.entered = true; tileRain(); }
      else if (S.mode === 'idle' && S.next < 4) setHint(S.next === 0 ? '拖动星星手柄转一圈 ↻' : hintEl.textContent, [CLOSE.crank[0], CLOSE.crank[1] - 40]);
    } });
}
function backToPark(){
  if (OV.mode !== 'closeup' || !['idle', 'waiting'].includes(S.mode)) return;
  OV.mode = 'pulling'; hintEl.style.opacity = 0;
  OV.T = pushPlan(); OV.T.Pend = { x:CLOSE.anchor[0]*CL.s + CL.ox, y:CLOSE.anchor[1]*CL.s + CL.oy };   // 从当前平移位置拉出
  SFX.play('whoosh', { gain:0.4, rate:0.85 }); swish(-1);
  const o = { e:1 };
  gsap.to(o, { e:0, duration:REDUCED ? .5 : 1.25, ease:'power2.inOut', onUpdate(){ setPush(o.e); },
    onComplete(){ OV.mode = 'overview'; LAYER.close = false; Object.assign(OV, OV.home); ovClampPan(); if (TOUCH) gsap.to(OV, { hover:1, duration:.6 });
      if (S.mode === 'waiting') hintEl.style.opacity = 0; } });
}
// 推镜头时，前景的花瓣和泡泡从镜头两侧掠过（dir = 1 进入，-1 返回）
function swish(dir){
  if (REDUCED) return;
  const W = innerWidth, H = innerHeight;
  for (let k = 0; k < 9; k++){
    const side = k % 2 ? 1 : -1, y = rnd(H*0.15, H*0.9);
    const x0 = dir > 0 ? W/2 + side*rnd(40, W*0.25) : (side > 0 ? W + 40 : -40);
    const v = side*rnd(700, 1200)*(dir > 0 ? 1 : -1);
    FX.add({ x:x0, y, vx:v, vy:rnd(-80, 80), g:0, drag:0.5, life:rnd(0.7, 1.1), sz0:rnd(18, 34), kind:k % 3 === 0 ? 1 : 2, rot:rnd(0, 6), spin:rnd(-5, 5), a0:0.75, color:'#ffffff', fadeIn:0.1 });
  }
}

/* ================================================================== ⑧ 氛围：光尘 / 萤火 / 飘过的花瓣 */
const AMB = { mote:0, petal:0 };
function updateAmbient(dt){
  if (OV.mode !== 'closeup' || REDUCED) return;
  AMB.mote -= dt; AMB.petal -= dt;
  const motes = FX.list.filter(p => p.mote).length;
  if (AMB.mote < 0 && motes < (S.night > 0.5 ? 16 : 20)){
    AMB.mote = 0.25;
    const night = S.night > 0.5;
    const [bx0, by0, bx1, by1] = night ? [100, 300, 1600, 900] : CLOSE.beamBox;
    const [x, y] = clToScreen(rnd(bx0, bx1), rnd(by0, by1));
    FX.add({ x, y, vx:rnd(-6, 10), vy:rnd(-10, 4), g:0, drag:0, life:rnd(5, 9), sz0:rnd(4, 8)*(night ? 1.3 : 1), kind:1, color:night ? pick1(['#fff1b0', '#d8ffb8', '#ffe2f4']) : '#fff7e0', a0:night ? 0.8 : 0.55, fadeIn:1.2, mote:true, tw:night });
  }
  if (AMB.petal < 0 && S.night < 0.5){
    AMB.petal = rnd(1.8, 3.5);
    const H = innerHeight;
    FX.add({ x:-20, y:rnd(0, H*0.6), vx:rnd(40, 80), vy:rnd(20, 45), g:4, drag:0, life:rnd(9, 14), sz0:rnd(9, 15), kind:2, rot:rnd(0, 6), spin:rnd(-1, 1), a0:0.75, petal:true, seed:Math.random()*10, fadeIn:0.8, hold:0.85 });
  }
}

/* ================================================================== ⑨ 主循环 */
const clock = new THREE.Clock();
if (DEBUG || Q.has('fps')){ QUAL.fpsEl = document.createElement('div'); QUAL.fpsEl.id = 'fps'; document.body.appendChild(QUAL.fpsEl); }
function setPR(pr){ QUAL.pr = pr; R.setPixelRatio(pr); R.setSize(innerWidth, innerHeight, false); ovU.uDpr.value = pr; }
function perfTick(raw){
  if (raw > 0.1 || document.hidden) return;
  QUAL.fAcc += raw; QUAL.fN++;
  if (QUAL.fpsEl && QUAL.fN >= 30){ QUAL.fpsEl.textContent = `${Math.round(QUAL.fN/QUAL.fAcc)} fps · ${OV.mode} · 像素比 ${QUAL.pr} · 档位 ${QUAL.level}`; QUAL.fAcc = QUAL.fN = 0; }
  if (OV.mode === 'pushing' || OV.mode === 'pulling'){ QUAL.acc = QUAL.n = 0; return; }
  QUAL.acc += raw; QUAL.n++;
  if (QUAL.n >= 90){
    if (QUAL.acc/QUAL.n > 1/48){
      // 降档：像素比 → 关景深 / 云影 → 粒子减半
      if (QUAL.pr > 1.25) setPR(Math.max(1.25, +(QUAL.pr - 0.25).toFixed(2)));
      else if (QUAL.level === 0){ QUAL.level = 1; clU.uCloud.value = 0; CL.dofBase = 0; }
      else if (QUAL.level === 1){ QUAL.level = 2; FX.cap = 450; }
    }
    QUAL.acc = QUAL.n = 0;
  }
}
CL.dofBase = REDUCED ? 0 : 0.42;
function frame(dt, t){
  ovU.uTime.value = t;
  // —— 总览 ——
  if (LAYER.ov){
    OV.par.lerp(OV.parT, 1 - Math.exp(-dt*2.5));
    const amp = OV.mode === 'overview' && !REDUCED ? OVERVIEW.parallax/OV.s : 0;
    ovU.uPar.value.set(OV.par.x*amp, OV.par.y*amp);
    ovU.uView.value.set(OV.s, OV.ox, OV.oy); ovU.uHover.value = OV.hover;
    ovBub.u.uPar.value.set(-OV.par.x*amp*2, -OV.par.y*amp*2);
    const tip = $('#ovTip'), show = OV.mode === 'overview' && (TOUCH || OV.hover > 0.5);
    tip.classList.toggle('on', show);
    if (show){ const [x, y] = ovToScreen(...OVERVIEW.machine.tip); tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
    const push = P.pos && OV.mode === 'overview' ? { x:ovToImg(...P.pos)[0], y:ovToImg(...P.pos)[1], r:26 } : null;
    ovBub.update(dt, t, push);
    ovBub.mesh.visible = OV.mode === 'overview' || OV.push < 0.35;
  }
  // —— 近景 ——
  if (LAYER.close && CL.ready){
    CL.par.lerp(CL.parT, 1 - Math.exp(-dt*3));
    const amp = REDUCED ? 0 : CLOSE.parallax;
    const Pv = new THREE.Vector2(-CL.par.x*amp, -CL.par.y*amp*0.6);
    const fD = depthAtY(715); clU.uFocusD.value = fD; CL.focusD = fD;
    clU.uPar.value.copy(Pv);
    // 景深：焦点跟着光标的纵向位置轻轻移动，但始终偏向扭蛋机
    const my = P.pos ? clToImg(...P.pos)[1] : 600;
    clU.uDofD.value = lerp(fD, depthAtY(clamp(my, 100, 940)), 0.3);
    clU.uDof.value = Math.max(CL.dofBase, (CL.pushDof || 0)*0.9);
    clU.uMoon.value.w = REDUCED ? 0 : Math.sin(t*0.8)*0.035;
    // 小女孩轻轻呼吸
    clU.uGirlK.value.forEach((K, i) => { if (!K.busy){ K.y = 1; K.z = 1 + Math.sin(t*1.9 + i*1.7)*0.007*(REDUCED ? 0 : 1); } });
    clApplyView();
    sprites.forEach(sp => {
      if (sp.u.uScreen.value) return;
      if (sp.depthD != null) sp.u.uPar.value.set((sp.depthD - fD)*Pv.x, (sp.depthD - fD)*Pv.y);
    });
    FORE.forEach((sp, i) => { sp.u.uPar.value.set(Pv.x*CL.s*(1.6 + i*0.4), Pv.y*CL.s*(1.6 + i*0.4)); sp.m.visible = OV.mode !== 'overview'; });
    // 灯珠视差（按各自深度）
    BULB_LIST.forEach((b, i) => { const p = BULBS.list[i], d = b.d ?? (b.d = ['carousel'].includes(b.group) ? depthAtY(260) : b.group === 'ferris' ? depthAtY(150) : b.group === 'chain' ? depthAtY(b.y + 45) : fD);
      p.x = b.x + (d - fD)*Pv.x; p.y = b.y + (d - fD)*Pv.y; });
    updateInner(dt, t);
    updateBulbs(t);
    updateCap(dt, t);
    const push = P.pos && OV.mode === 'closeup' ? { x:clToImg(...P.pos)[0], y:clToImg(...P.pos)[1], r:30 } : null;
    clBub.u.uPar.value.copy(Pv);
    clBub.update(dt, t, push);
    updateAmbient(dt);
    if (hintEl.style.opacity !== '0' && hintAt){
      const [x, y] = clToScreen(...hintAt); hintEl.style.left = x + 'px'; hintEl.style.top = y + 'px';
      if (S.mode === 'waiting' && S.cap){ hintAt = [S.cap.x, S.cap.y - 56]; }
    }
  }
  updateBlow(dt);
  updateFX(dt);
  // —— 画 ——
  R.clear();
  if (LAYER.close && CL.ready) R.render(clScene, cam);
  if (LAYER.ov) R.render(ovScene, cam);
  R.render(fxScene, cam);
}
function loop(){
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05);
  perfTick(raw);
  frame(dt, clock.elapsedTime);
  requestAnimationFrame(loop);
}

/* ================================================================== 启动 / 尺寸 / 调试 */
function resize(){
  R.setSize(innerWidth, innerHeight, false);
  ovU.uRes.value.set(innerWidth, innerHeight); ovU.uDpr.value = R.getPixelRatio();
  cam.right = innerWidth; cam.bottom = innerHeight; cam.updateProjectionMatrix();
  if (OV.mode === 'overview') ovLayout(false);
  if (OV.mode === 'closeup'){ const cx = (innerWidth/2 - CL.ox)/CL.s; clLayout(); }
  layoutFore();
}
addEventListener('resize', resize);
mgrOV.onLoad = () => { OV.ready = true; canvas.classList.add('ready'); };
mgrOVLater.onLoad = () => { OV.nightReady = true; ovU.uNightT.value = S.night; };
mgrCL.onLoad = () => { CL.ready = true; if (CL.pendingEnter){ CL.pendingEnter = false; enterMachine(); } };
RM.addEventListener?.('change', e => { REDUCED = e.matches; ovU.uMotion.value = REDUCED ? 0.3 : 1; clU.uSway.value = REDUCED ? 0 : 1.3; clU.uCloud.value = REDUCED ? 0 : 0.16; CL.dofBase = REDUCED ? 0 : 0.42; });

$('#btnNight').onclick = toggleNight;
$('#btnSound').onclick = () => SFX.toggle();
$('#btnSpin').onclick = () => { if (S.mode === 'idle'){ if (S.next >= 4){ toast('都扭完啦，点图鉴随时回看'); return; } spin(); } else if (S.mode === 'waiting') openCapsule(); };
$('#btnReset').onclick = () => location.reload();
$('#btnHome').onclick = backToPark;
$('#btnExpand').onclick = expandCard;
$('#btnStash').onclick = stashCard;
$('#btnBack').onclick = collapseCard;
backdrop.addEventListener('click', () => { if (card.classList.contains('expanded')) collapseCard(); else stashCard(); });
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.mode === 'opening' && S.tl){ S.tl.progress(1); return; }
  if (S.mode === 'card'){ card.classList.contains('expanded') ? collapseCard() : stashCard(); return; }
  if (OV.mode === 'closeup') backToPark();
});

ovLayout(true); clLayout(); layoutFore(); resize(); applyNight(0);
loop();
// 调试：?debug 时 window.__dbg；预览窗口隐藏时 rAF 会停，用 __dbg.tick(n) 手动推进
window.__dbg = { OV, CL, S, ovU, clU, R, setPush, enterMachine, backToPark, applyNight, tileRain, SFX, FX, clBub, ovBub, BULB_LIST, sprites, CLOSE,
  tick(n = 1, dt = 1/60){ gsap.ticker.lagSmoothing(0); for (let i = 0; i < n; i++){ gsap.ticker.tick(); clock.elapsedTime += dt; frame(dt, clock.elapsedTime); } },
  snap(){ frame(0, clock.elapsedTime); const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height; c.getContext('2d').drawImage(canvas, 0, 0); return c.toDataURL('image/jpeg', 0.85); } };

</script>
</body>
</html>
